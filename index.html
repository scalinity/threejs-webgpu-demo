<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <title>Three.js r182 • WebGPU • PBR + Compute</title>

    <style>
      html, body { height: 100%; margin: 0; background: #05060a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      .hud {
        position: fixed;
        left: 14px;
        top: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(10, 12, 18, 0.55);
        backdrop-filter: blur(10px);
        color: rgba(255,255,255,0.86);
        font: 12px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        letter-spacing: 0.2px;
        user-select: none;
      }
      .hud b { color: rgba(255,255,255,0.95); font-weight: 650; }
      .hud .row { display: flex; gap: 8px; align-items: baseline; }
      .hud .muted { color: rgba(255,255,255,0.58); }
      .hud .dot {
        width: 8px; height: 8px; border-radius: 999px;
        background: #45ff9a; box-shadow: 0 0 12px rgba(69,255,154,0.35);
        display: inline-block; margin-right: 8px;
      }
    </style>

    <!-- Importmap: Three r182 (three@0.182.0) WebGPU + TSL -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>

    <div class="hud" id="hud">
      <div class="row"><span class="dot"></span><b>WebGPU Demo</b></div>
      <div class="row muted">PBR • HDR • Soft Shadows • Compute Swarm</div>
      <div class="row" style="margin-top:8px;">
        <span class="muted">Backend:</span> <span id="backend">…</span>
      </div>
      <div class="row">
        <span class="muted">Instances:</span> <span id="instances">…</span>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
